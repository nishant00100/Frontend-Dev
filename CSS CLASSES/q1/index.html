<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pseudo-Classes Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Pseudo-Classes Examples</h1></header>

  <main class="row">
    <section class="item">
      <h2>:hover</h2>
      <p>Links change background on hover:</p>
      <a href="#">Hover me</a>
    </section>

    <section class="item">
      <h2>:focus</h2>
      <p>Input shows focus outline:</p>
      <input type="text" placeholder="Focus me">
    </section>

    <section class="item">
      <h2>:active</h2>
      <p>Button shows active state:</p>
      <button>Press me</button>
    </section>

    <section class="item">
      <h2>:nth-child()</h2>
      <p>List items styled by nth-child:</p>
      <ul class="nth">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
      </ul>
    </section>
  </main>

  <footer><p>Short explanations beside each example.</p></footer>
</body>
</html>
