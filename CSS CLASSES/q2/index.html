<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>CSS Tooltips</h1></header>
  <main class="center">
    <div class="tool-row">
      <div class="tooltip-wrap">
        <span class="label">Info</span>
        <div class="tooltip">This is an information tooltip.</div>
      </div>

      <div class="tooltip-wrap">
        <span class="label">Help</span>
        <div class="tooltip">Help text appears here.</div>
      </div>

      <div class="tooltip-wrap">
        <span class="label">Icon</span>
        <div class="tooltip">Tooltip for icon-like element.</div>
      </div>
    </div>
  </main>
  <footer><p>Tooltips built only with CSS (absolute positioning + opacity transitions).</p></footer>
</body>
</html>
