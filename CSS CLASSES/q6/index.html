<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Animations Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>CSS Animations</h1></header>
  <main class="center">
    <div class="anim-row">
      <div class="box move"></div>        <!-- moving box -->
      <div class="ball bounce"></div>    <!-- bouncing ball -->
      <div class="text color-change">Text</div> <!-- color-changing text -->
    </div>
  </main>
  <footer><p>Animations use keyframes, delays, and infinite iterations.</p></footer>
</body>
</html>
