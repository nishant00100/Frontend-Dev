<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mini UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><h1>Mini UI</h1></header>

  <main class="center">
    <section class="card">
      <h2>Contact</h2>

      <form>
        <label>Name <input type="text" required></label>
        <label>Email <input type="email" required></label>
        <label>Message <textarea rows="4" required></textarea></label>

        <div class="row">
          <button class="btn" type="submit">Send</button>
          <button class="btn outline" type="reset">Reset</button>
        </div>

        <img src="https://picsum.photos/120/80" alt="small">
      </form>
    </section>
  </main>

  <footer class="foot"><p>Mini UI with focus & hover effects</p></footer>
</body>
</html>
