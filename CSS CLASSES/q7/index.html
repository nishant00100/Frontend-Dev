<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UI Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header><h2>Search & Actions</h2></header>

    <div class="controls">
      <input type="search" placeholder="Search..." aria-label="Search">
      <select>
        <option>All</option>
        <option>Articles</option>
        <option>Images</option>
      </select>
      <div class="btns">
        <button>Search</button>
        <button class="primary">New</button>
      </div>
    </div>

    <footer><p>UI card with consistent spacing and focus states.</p></footer>
  </main>
</body>
</html>
