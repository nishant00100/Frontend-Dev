<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Button Styles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Button Collection</h1></header>
  <main class="wrap">
    <div class="btns">
      <button class="primary">Primary</button>
      <button class="secondary">Secondary</button>
      <button class="outline">Outline</button>
      <button class="disabled" disabled>Disabled</button>
    </div>
  </main>
  <footer><p>Focus and disabled states demonstrated.</p></footer>
</body>
</html>
