<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container my-5">
  <div class="card p-4">
    <h3 class="mb-4">User Notifications</h3>

    <!-- Alerts -->
    <div class="alert alert-success">✔ New message received!</div>
    <div class="alert alert-info">ℹ Profile updated successfully.</div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      ⚠ Password will expire soon!
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Summary well -->
    <div class="bg-light border rounded p-3 mt-4">
      <p class="mb-0">3 Notifications displayed — all systems operational.</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
