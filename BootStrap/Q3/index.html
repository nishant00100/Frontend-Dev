<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="row g-4">
      <!-- 4 col grid → col-md-3 for desktop -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="images/p1.jpg" class="card-img-top" alt="">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p>$59.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <!-- repeat similar cards -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="images/p2.jpg" class="card-img-top" alt="">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p>$79.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <!-- Add 2 more -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="images/p3.jpg" class="card-img-top" alt="">
          <div class="card-body text-center">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p>$39.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="images/p4.jpg" class="card-img-top" alt="">
          <div class="card-body text-center">
            <h5 class="card-title">VR Headset</h5>
            <p>$99.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
