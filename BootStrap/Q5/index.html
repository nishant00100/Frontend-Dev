<html lang="en">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="profiles">

      <img src="images/profile1.jpg" alt="Profile 1">

    <article class="card">
      <img src="images/profile3.jpg" alt="Profile 3">

    </article>

</html>
