<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing Plans</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container py-5 text-center">
  <h2 class="mb-5">Choose Your Plan</h2>
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h4>Basic</h4><p>$9 / mo</p>
          <ul class="list-unstyled"><li>1 User</li><li>Email Support</li></ul>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100 bg-primary text-white shadow-lg">
        <div class="card-body">
          <h4>Pro</h4><p>$19 / mo</p>
          <ul class="list-unstyled"><li>5 Users</li><li>Priority Support</li></ul>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h4>Enterprise</h4><p>$29 / mo</p>
          <ul class="list-unstyled"><li>Unlimited Users</li><li>24/7 Support</li></ul>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
