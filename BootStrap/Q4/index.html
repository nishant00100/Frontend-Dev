<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-4">Today’s Menu</h1>

    <!-- Table -->
    <table class="table table-striped text-center">
      <thead class="table-dark">
        <tr><th>Category</th><th>Item</th><th>Price</th></tr>
      </thead>
      <tbody>
        <tr><td>Starters</td><td>Tomato Soup</td><td>$5</td></tr>
        <tr><td>Main</td><td>Grilled Salmon</td><td>$15</td></tr>
        <tr><td>Dessert</td><td>Chocolate Mousse</td><td>$7</td></tr>
      </tbody>
    </table>

    <!-- Specials -->
    <section class="my-4">
      <h3 class="text-center">Chef’s Specials</h3>
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Pasta Alfredo</li>
        <li class="list-group-item">BBQ Chicken Pizza</li>
      </ul>
    </section>

    <figure class="text-center">
      <img src="images/food.jpg" alt="Dish" class="img-fluid rounded">
      <figcaption class="lead mt-2">Fresh and Delicious!</figcaption>
    </figure>
  </main>
</body>
</html>
