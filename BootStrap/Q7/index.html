<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <h3>Tasks <sup class="badge bg-primary">3 Pending</sup></h3>
  <ul class="list-group mt-3">
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Finish UI Design <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Update Docs <span class="badge bg-warning text-dark">Medium</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Review Code <span class="badge bg-success">Low</span>
    </li>
  </ul>
  <button class="btn btn-success mt-4">
    Completed <span class="badge bg-light text-success">1</span>
  </button>
</main>
</body>
</html>
