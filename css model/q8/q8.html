<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Box Model Exploration</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <header><h1>Box Model Layers</h1></header>

  <main class="center">
    <section class="model">
      <div class="layer margin">
        <div class="layer border">
          <div class="layer padding">
            <div class="content">Content</div>
          </div>
        </div>
      </div>

      <aside class="notes">
        <p><strong>Content</strong>: Actual text or image.</p>
        <p><strong>Padding</strong>: Space inside border.</p>
        <p><strong>Border</strong>: Line around padding.</p>
        <p><strong>Margin</strong>: Space outside border.</p>
      </aside>
    </section>
  </main>
</body>
</html>
