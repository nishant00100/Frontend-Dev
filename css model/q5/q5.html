<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <header><h1>Advanced Selectors</h1></header>

  <main>
    <form>
      <label>Text field: <input type="text" name="name"></label>
      <label>Email: <input type="email" name="email"></label>
    </form>

    <nav class="links">
      <a href="https://example.com">Secure Link</a>
      <a href="http://example.org">Non-secure</a>
      <a href="#local">Local</a>
    </nav>

    <ul class="items">
      <li>Item 1</li>
      <li>Item 2</li>
      <li class="special">Item 3 (special)</li>
      <li>Item 4</li>
    </ul>
  </main>
</body>
</html>
