<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gradient Backgrounds</title>
  <link rel="stylesheet" href="q3.css">
</head>
<body>
  <header class="fixed-header"><h1>Gradient Types</h1></header>

  <main>
    <section class="linear">
      <h2>Linear Gradient</h2>
      <p>This section uses a linear gradient background.</p>
    </section>

    <section class="radial">
      <h2>Radial Gradient (parallax-like)</h2>
      <p>This section uses a radial gradient, background-attachment: fixed creates a parallax feel.</p>
    </section>
  </main>

  <footer class="fixed-footer"><p>Fixed footer - layout complete</p></footer>
</body>
</html>
