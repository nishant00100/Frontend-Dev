<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Borders & Padding Demo</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Borders & Padding Demonstration</h1>
  </header>

  <main>
    <section class="container">
      <div class="box solid">Solid border<br><span class="note">padding: 16px</span></div>
      <div class="box dashed">Dashed border<br><span class="note">padding: 12px</span></div>
      <div class="box double">Double border<br><span class="note">padding: 20px</span></div>
      <div class="box groove rounded">Groove + rounded corners<br><span class="note">border-radius: 16px</span></div>
    </section>
  </main>

  <footer>
    <p>Example: hover to change border color smoothly</p>
  </footer>
</body>
</html>
