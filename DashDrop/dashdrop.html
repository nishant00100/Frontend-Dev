<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Drop - Blockchain Node Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #1a202c;
        }

        .web-page {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .left {
            width: 256px;
            background: #fafafa;
            border-right: 1px solid #e5e7eb;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f3f4f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            color: #3b82f6;
        }

        .nav-text {
            color: #1a202c;
            font-weight: 500;
        }

        /* Right Content */
        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .first {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e5e7eb;
        }

        .l1 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .l1 p:first-child {
            color: #1a202c;
            font-weight: 500;
        }

        .l1 p:last-child {
            color: #3b82f6;
        }

        .l2 {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .credits {
            font-size: 14px;
        }

        .credits-label {
            color: #6b7280;
        }

        .credits-value {
            color: #3b82f6;
            font-weight: 600;
        }

        .connect-wallet-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        .connect-wallet-btn:hover {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }

        /* Main Content */
        .second {
            flex: 1;
            overflow: auto;
            padding: 32px;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 32px;
            animation: fadeIn 0.5s ease-out;
        }

        .form-section {
            margin-bottom: 32px;
            animation: slideUp 0.4s ease-out;
        }

        h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1a202c;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        /* Chain Selection */
        .images {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .chain-option {
            padding: 24px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .chain-option:hover {
            border-color: rgba(59, 130, 246, 0.5);
            background: white;
        }

        .chain-option.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        .chain-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 8px;
            color: #9ca3af;
        }

        .chain-option.selected .chain-icon {
            color: #3b82f6;
        }

        .chain-label {
            font-size: 12px;
            font-weight: 500;
            color: #9ca3af;
        }

        .chain-option.selected .chain-label {
            color: #3b82f6;
        }

        /* Radio Groups */
        .radio-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .radio-option {
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            color: #9ca3af;
        }

        .radio-option:hover label {
            border-color: rgba(59, 130, 246, 0.5);
            background: white;
        }

        .radio-option input[type="radio"]:checked + label {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        /* API Input */
        .api input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .api input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        .api input[type="text"]::placeholder {
            color: #9ca3af;
        }

        /* Price Section */
        .price {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 1), rgba(240, 249, 255, 1));
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .price-label {
            color: #6b7280;
            font-weight: 500;
        }

        .price-value {
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
        }

        /* Buttons */
        .add_cancel {
            display: flex;
            gap: 16px;
            padding-top: 16px;
        }

        .add_cancel button {
            flex: 1;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .cancel-btn {
            background: white;
            color: #1a202c;
            border: 1px solid #e5e7eb;
        }

        .cancel-btn:hover {
            border-color: rgba(59, 130, 246, 0.5);
        }

        .add-btn {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            border: none;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        .add-btn:hover {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .web-page {
                flex-direction: column;
            }

            .left {
                width: 100%;
            }

            .images,
            .radio-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="web-page">
        <div class="left">
            <div class="logo-section">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                    </svg>
                </div>
                <h2 class="logo-text">Dash Drop</h2>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
                <p class="nav-text">Nodes</p>
            </div>
        </div>
        
        <div class="right">
            <div class="first">
                <div class="l1">
                    <p>Nodes</p>
                    <span>/</span>
                    <p>Add Node</p>
                </div>
                <div class="l2">
                    <p class="credits">
                        <span class="credits-label">Available Credits: </span>
                        <span class="credits-value">9.900</span>
                    </p>
                    <button class="connect-wallet-btn">Connect Wallet</button>
                </div>
            </div>
            
            <div class="second">
                <h1>Add Node</h1>

                <div class="form-section">
                    <h3>Select Chain</h3>
                    <div class="images">
                        <div class="chain-option" onclick="selectChain(this)">
                            <img src="WhatsApp Image 2025-10-14 at 11.42.05 AM.jpeg" alt="" height="145px" width="228px" >
                            <p class="chain-label">Ethereum</p>
                        </div>
                        <div class="chain-option" onclick="selectChain(this)">
                            <img src="WhatsApp Image 2025-10-14 at 11.42.06 AM (1).jpeg" alt="" height="145px" width="228px">
                            <p class="chain-label">Bitcoin</p>
                        </div>
                        <div class="chain-option" onclick="selectChain(this)">
                            <img src="WhatsApp Image 2025-10-14 at 11.42.06 AM (2).jpeg" alt="" height="145px" width="228px">
                            <p class="chain-label">Polygon</p>
                        </div>
                        <div class="chain-option" onclick="selectChain(this)">
                            <img src="WhatsApp Image 2025-10-14 at 11.42.06 AM.jpeg" alt="" height="145px" width="228px">
                            <p class="chain-label">Avalanche</p>
                        </div>
                    </div>
                </div>

                <div class="form-section env">
                    <h3>Select Environment</h3>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="environment" id="net" value="devnet">
                            <label for="net">Dev Net</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="environment" id="e" value="testnet">
                            <label for="e">Test Net</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="environment" id="f" value="mainnet">
                            <label for="f">Main Net</label>
                        </div>
                    </div>
                </div>

                <div class="form-section server">
                    <h3>Select Server Type</h3>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="server" id="sm" value="small">
                            <label for="sm">Small</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="server" id="med" value="medium">
                            <label for="med">Medium</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="server" id="Lar" value="large">
                            <label for="Lar">Large</label>
                        </div>
                    </div>
                </div>

                <div class="form-section months">
                    <h3>Select Number of Months</h3>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="months" id="a" value="3">
                            <label for="a">03</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="months" id="b" value="6">
                            <label for="b">06</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="months" id="c" value="12">
                            <label for="c">12</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="months" id="d" value="1">
                            <label for="d">01</label>
                        </div>
                    </div>
                </div>

                <div class="form-section api">
                    <h3>Blockpi Api</h3>
                    <input type="text" placeholder="Enter blockpi api">
                </div>

                <div class="price">
                    <p class="price-label">Price</p>
                    <p class="price-value">5,999 rs.</p>
                </div>

                <div class="add_cancel">
                    <button class="cancel-btn">Cancel</button>
                    <button class="add-btn">Add Node</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectChain(element) {
            // Remove selected class from all chain options
            document.querySelectorAll('.chain-option').forEach(option => {
                option.classList.remove('selected');
            });
            // Add selected class to clicked element
            element.classList.add('selected');
        }
    </script>
</body>
</html>
