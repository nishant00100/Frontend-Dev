<!-- secureform.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Security Attributes</title>
</head>
<body>
  <h2>Secure Form</h2>
  <form autocomplete="off">
    Username: <input type="text" required><br>
    Password: <input type="password" required><br>
    <input type="submit" value="Login">
  </form>
  <p>Turning off autocomplete helps prevent browsers from saving sensitive login details.</p>
</body>
</html>
