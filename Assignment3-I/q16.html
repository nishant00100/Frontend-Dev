<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URI Encoding Example</title>
</head>
<body>
  <h2>URI Encoding</h2>
  <p>Incorrect URL: 
    <a href="https://example.com/search?query=HTML & CSS">Click Here</a>
  </p>
  <p>Encoded URL:
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Click Here</a>
  </p>
</body>
</html>
