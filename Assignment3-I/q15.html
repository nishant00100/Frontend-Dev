<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Form</title>
</head>
<body>
  <h2>Payment Form</h2>
  <form>
    Cardholder Name: <input type="text" required><br>
    Card Number: <input type="number" required><br>
    Expiry Date: <input type="month" required><br>
    CVV: <input type="password" required><br>
    <input type="submit" value="Pay Now">
  </form>
</body>
</html>
