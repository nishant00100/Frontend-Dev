<!-- map.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My City Map</title>
</head>
<body>
  <h2>My City on Google Map</h2>
  <!-- The loading="lazy" attribute delays loading the map until it appears in the viewport -->
  <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3..."
      width="80%" height="400"
      loading="lazy"
      title="Map of My City">
  </iframe>
</body>
</html>
