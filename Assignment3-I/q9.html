<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload</title>
</head>
<body>
  <h2>Upload Image</h2>
  <form>
    <input type="file" accept=".jpg, .png" required><br>
    <p>Only .jpg or .png image files are allowed.</p>
    <input type="submit" value="Upload">
  </form>
</body>
</html>
