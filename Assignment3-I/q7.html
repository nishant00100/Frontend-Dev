<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
</head>
<body>
  <h2>Login</h2>
  <form>
    Username: <input type="text" required><br>
    Password: <input type="password" required><br>
    <input type="hidden" name="csrf_token" value="1234567890">
    <!-- CSRF token helps prevent Cross-Site Request Forgery attacks -->
    <input type="submit" value="Login">
  </form>
</body>
</html>
